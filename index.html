<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài đặt Locket Gold by Tphat</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding: 40px 20px; background: #121212; color: #fff; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 16px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #ffd700; margin-top: 0; }
        p { color: #ccc; line-height: 1.5; font-size: 15px; }
        .btn { display: inline-block; margin-top: 15px; padding: 14px 28px; background: #ffd700; color: #000; text-decoration: none; font-weight: bold; border-radius: 10px; font-size: 16px; }
        .note { margin-top: 20px; font-size: 13px; color: #ff6b6b; }
    </style>
    <script>
        // Tự động kích hoạt tải hồ sơ ngay khi mở trang bằng Safari
        window.onload = function() {
            setTimeout(function() {
                window.location.href = "LocketGold.mobileconfig";
            }, 500);
        };
    </script>
</head>
<body>
    <div class="card">
        <h2>✨ LOCKET GOLD VIP ✨</h2>
        <p>Hồ sơ cấu hình chặn thu hồi Locket Gold.<br>Bản quyền: <b>@ntanphatt</b></p>
        <a class="btn" href="LocketGold.mobileconfig">Cài đặt Cấu hình ngay</a>
        <p class="note">⚠️ Lưu ý: Hãy nhấn dấu (...) ở góc màn hình và chọn <b>"Mở bằng trình duyệt Safari"</b> để cài đặt.</p>
    </div>
</body>
</html>
